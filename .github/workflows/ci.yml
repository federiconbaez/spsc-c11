name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.san || 'release' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        cc: [gcc, clang]
        san: [thread, address, ""]
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Lower ASLR entropy for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_BUILD_TYPE=${{ matrix.san && 'RelWithDebInfo' || 'Release' }}
          -DSPSC_SANITIZER=${{ matrix.san }}
          -DSPSC_STRESS_ITEMS=${{ matrix.san && '2000000' || '20000000' }}
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Bench smoke (release only, numbers are informational)
        if: matrix.san == ''
        run: ./build/bench_spsc 0 1 2000000
